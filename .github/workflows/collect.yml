name: Race Edge collect

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 0-14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect BOAT RACE data
        run: node scripts/collect.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
